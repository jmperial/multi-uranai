<!DOCTYPE html>
<html>
<head>
  <base href="/multi-uranai/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="占いダッシュボード">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="占いダッシュボード">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>占いダッシュボード</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0D0F2B;
    }
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0D0F2B;
      color: white;
      font-family: sans-serif;
      z-index: 9999;
    }
    .loading-emoji { font-size: 48px; margin-bottom: 16px; }
    .loading-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
    .loading-sub { font-size: 13px; color: #aaa; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-emoji">✨</div>
    <div class="loading-title">占いダッシュボード</div>
    <div class="loading-sub">読み込み中...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
</body>
</html>
